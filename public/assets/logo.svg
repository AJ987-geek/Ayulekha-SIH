<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="6" y1="4" x2="42" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A5C38"/>
      <stop offset="100%" stop-color="#0D3B25"/>
    </linearGradient>
    <filter id="shadow" x="0" y="2" width="48" height="46" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0D3B25" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer Shield Frame -->
  <path d="M24 4L8 10V22C8 32.5 14.8 42.1 24 45C33.2 42.1 40 32.5 40 22V10L24 4Z" 
        fill="url(#shieldGrad)" 
        stroke="#2D7A52" 
        stroke-width="1.5" 
        filter="url(#shadow)"/>
        
  <!-- Subtle Inner Shield Inset -->
  <path d="M24 7L11 12V22C11 30.5 16.5 38.6 24 41.2C31.5 38.6 37 30.5 37 22V12L24 7Z" 
        stroke="rgba(255,255,255,0.2)" 
        stroke-width="1" 
        fill="none"/>

  <!-- Clinical Medical Plus / Cross -->
  <path d="M24 14V34M14 24H34" 
        stroke="#ffffff" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- ABDM Saffron Heart / Core Accent -->
  <circle cx="24" cy="24" r="3.5" fill="#E8631A" stroke="#ffffff" stroke-width="1.2"/>
</svg>
